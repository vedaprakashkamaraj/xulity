# Builds ready-to-run apps for Windows and Linux with PyInstaller.
# Put xutil.py (the single-file build) and gui_entry.py in the repo root.
# Run it from the Actions tab, or push a tag like v1.0.0 to also publish a Release.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build terminal app and window app
        shell: bash
        run: |
          pyinstaller --onefile --name xutil-${{ runner.os }}-terminal xutil.py
          pyinstaller --onefile --windowed --name xutil-${{ runner.os }}-app gui_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: xutil-${{ runner.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
